[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-template-qatalyst"
version = "0.1.0"
description = "A minimal Python/FastAPI starter template"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
